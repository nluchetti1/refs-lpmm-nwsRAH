name: Look-back request (issue)

on:
  issues:
    types: [opened]

concurrency:
  group: refs-qpf
  cancel-in-progress: false

jobs:
  case:
    if: contains(github.event.issue.labels.*.name, 'lookback-request') || startsWith(github.event.issue.title, 'Look-back:')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      issues: write

    steps:
      - name: Acknowledge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh issue comment ${{ github.event.issue.number }} -R ${{ github.repository }} -b "Building this look-back now (about 10 min)."

      - uses: actions/checkout@v4

      - name: Checkout data branch
        uses: actions/checkout@v4
        with:
          ref: data
          path: data

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Cache Cartopy / MetPy shapefiles
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/metpy
            ~/.local/share/cartopy
          key: ${{ runner.os }}-shapes-10m-v1
          restore-keys: ${{ runner.os }}-shapes-

      - run: pip install -r requirements.txt

      - name: Build case
        id: build
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
        run: |
          set +e
          python request_case.py
          echo "code=$?" >> "$GITHUB_OUTPUT"

      - name: Prepare data branch
        if: steps.build.outputs.code == '0'
        run: rm -rf data/.git

      - name: Save data branch
        if: steps.build.outputs.code == '0'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: data
          publish_dir: ./data
          force_orphan: true
          enable_jekyll: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'

      - name: Deploy to GitHub Pages
        if: steps.build.outputs.code == '0' && hashFiles('site/index.html') != ''
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          force_orphan: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'

      - name: Reply and close
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [ -f reply.md ] || echo "The build stopped unexpectedly; see the workflow log." > reply.md
          gh issue comment ${{ github.event.issue.number }} -R ${{ github.repository }} -F reply.md
          gh issue close ${{ github.event.issue.number }} -R ${{ github.repository }}
