name: Look back

on:
  workflow_dispatch:
    inputs:
      start:
        description: 'Window start, YYYYMMDDHH UTC (blank if rebuilding all stale cases)'
        required: false
      end:
        description: 'Window end, YYYYMMDDHH UTC (3-72 h after start)'
        required: false
      title:
        description: 'Title shown on the site (leave blank when rebuilding to keep the old one)'
        required: false
        default: ''
      rebuild:
        description: 'Rebuild if this window already exists'
        type: boolean
        default: false
      rebuild_all:
        description: 'Rebuild all stale cases (ignores start/end; can take an hour or more)'
        type: boolean
        default: false

concurrency:
  group: refs-qpf
  cancel-in-progress: false

jobs:
  case:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout data branch
        uses: actions/checkout@v4
        with:
          ref: data
          path: data

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Cache Cartopy / MetPy shapefiles
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/metpy
            ~/.local/share/cartopy
          key: ${{ runner.os }}-shapes-10m-v1
          restore-keys: ${{ runner.os }}-shapes-

      - name: Install Python libraries
        run: pip install -r requirements.txt

      - name: Build case and republish
        env:
          START: ${{ inputs.start }}
          END: ${{ inputs.end }}
          TITLE: ${{ inputs.title }}
          REBUILD: ${{ inputs.rebuild }}
          REBUILD_ALL: ${{ inputs.rebuild_all }}
        run: |
          if [ "$REBUILD_ALL" = "true" ]; then
            python lookback.py --rebuild-stale
          else
            python lookback.py --start "$START" --end "$END" --title "$TITLE" $([ "$REBUILD" = "true" ] && echo --rebuild)
          fi

      - name: Prepare data branch
        run: rm -rf data/.git

      - name: Save data branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: data
          publish_dir: ./data
          force_orphan: true
          enable_jekyll: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'

      - name: Deploy to GitHub Pages
        if: hashFiles('site/index.html') != ''
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          force_orphan: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
