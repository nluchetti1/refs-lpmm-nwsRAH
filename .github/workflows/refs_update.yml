name: REFS QPF (build site)

on:
  schedule:
    # ~3h25m after each REFS cycle (f60 posted by +3h12m for 06Z on 2026-11-03).
    - cron: '25 3,9,15,21 * * *'
  workflow_dispatch:

concurrency:
  group: refs-qpf          # shared with the look-back workflows so they never race on the data branch
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Persistent state (forecast archive, scores, regime log, look-back cases,
      # last published site). Missing on the very first run, which is fine.
      - name: Checkout data branch
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: data
          path: data

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Cache Cartopy / MetPy shapefiles
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/metpy
            ~/.local/share/cartopy
          key: ${{ runner.os }}-shapes-10m-v1
          restore-keys: ${{ runner.os }}-shapes-

      - name: Install Python libraries
        run: pip install -r requirements.txt

      - name: Build maps, score verification, tag regimes
        run: python refs_qpf.py

      - name: Prepare data branch
        run: rm -rf data/.git

      - name: Save data branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: data
          publish_dir: ./data
          force_orphan: true
          enable_jekyll: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          force_orphan: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
