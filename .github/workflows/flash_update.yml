name: MRMS FLASH refresh

on:
  schedule:
    # FLASH updates every 10 min on NCEP; GitHub cron often runs late, so this is "about every 30 min"
    - cron: '7,37 * * * *'
  workflow_dispatch:

concurrency:
  group: refs-qpf
  cancel-in-progress: false

jobs:
  flash:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Checkout data branch
        uses: actions/checkout@v4
        with:
          ref: data
          path: data

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Cache Cartopy / MetPy shapefiles
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/metpy
            ~/.local/share/cartopy
          key: ${{ runner.os }}-shapes-10m-v1
          restore-keys: ${{ runner.os }}-shapes-

      - run: pip install -r requirements.txt

      - name: Refresh FLASH panel
        run: python flash.py

      - name: Deploy to GitHub Pages
        if: hashFiles('site/index.html') != ''
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          force_orphan: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
